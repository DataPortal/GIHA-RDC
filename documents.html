<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Stockage documentaire GiHA RDC</title>
  <link rel="stylesheet" href="documents.css" />
</head>
<body>

<header class="header">
  <h1>Bibliothèque documentaire GiHA RDC</h1>
  <p>Uploader, organiser et consulter les documents partagés.</p>
</header>

<main class="container">

  <section class="panel">
    <h2>Créer un dossier</h2>

    <input 
      type="text" 
      id="folderName" 
      placeholder="Exemple : Rapports 2026"
    />

    <button onclick="createFolder()">Créer le dossier</button>
  </section>

  <section class="panel">
    <h2>Uploader un fichier</h2>

    <select id="folderSelect">
      <option value="">Racine principale</option>
    </select>

    <input type="file" id="fileInput" />

    <button onclick="uploadFile()">Uploader</button>
  </section>

  <section class="panel">
    <h2>Documents disponibles</h2>

    <button onclick="loadFiles()">Actualiser la liste</button>

    <div id="fileList" class="file-list"></div>
  </section>

</main>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="documents.js"></script>

</body>
</html>
